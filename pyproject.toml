[project]
name = "speakermute"
version = "0.1.0"
description = "Mute chosen speakers in any video: WhisperX transcription + pyannote diarization + ffmpeg, video untouched."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Ranveer Singh", email = "ranveersinghbais@gmail.com" }]
keywords = ["whisperx", "diarization", "ffmpeg", "mute", "speakers", "podcast", "subtitles", "video"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "typer>=0.15",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "whisperx>=3.3",
]

[project.urls]
Homepage = "https://github.com/itsranveer/speakermute"
Repository = "https://github.com/itsranveer/speakermute"
Issues = "https://github.com/itsranveer/speakermute/issues"
Changelog = "https://github.com/itsranveer/speakermute/blob/main/CHANGELOG.md"

[project.scripts]
speakermute = "speakermute.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speakermute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
