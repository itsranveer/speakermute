name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # The tests replace whisperx and torch with in-memory fakes (tests/conftest.py),
      # so the PyTorch stack is never imported. Skipping it keeps the job to tens of MB
      # instead of the ~3.5 GB CUDA build that uv.lock resolves to on Linux.
      # The list mirrors torch's dependencies in uv.lock; update it if they change.
      - name: Install dependencies (without the PyTorch/CUDA stack)
        run: >-
          uv sync --locked
          --no-install-package torch
          --no-install-package torchaudio
          --no-install-package torchcodec
          --no-install-package triton
          --no-install-package nvidia-cublas-cu12
          --no-install-package nvidia-cuda-cupti-cu12
          --no-install-package nvidia-cuda-nvrtc-cu12
          --no-install-package nvidia-cuda-runtime-cu12
          --no-install-package nvidia-cudnn-cu12
          --no-install-package nvidia-cufft-cu12
          --no-install-package nvidia-cufile-cu12
          --no-install-package nvidia-curand-cu12
          --no-install-package nvidia-cusolver-cu12
          --no-install-package nvidia-cusparse-cu12
          --no-install-package nvidia-cusparselt-cu12
          --no-install-package nvidia-nccl-cu12
          --no-install-package nvidia-nvjitlink-cu12
          --no-install-package nvidia-nvtx-cu12

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Format check
        run: uv run --no-sync ruff format --check .

      - name: Test
        run: uv run --no-sync pytest
